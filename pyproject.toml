[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rba"]

[project]
name = "rba"
version = "0.0.1"
description = "Predict RBA target cash rate"
authors = [
  { name = "tg" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lightgbm>=4.6.0",
    "loguru",
    "mlflow>=1.27.0",
    "mord>=0.7",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pip",
    "plotly>=6.7.0",
    "pyarrow>=24.0.0",
    "pyreadr>=0.5.6",
    "pytest",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "ruff",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "streamlit>=1.57.0",
    "tqdm",
    "transformers>=5.7.0",
    "typer",
    "xgboost>=3.2.0",
    "xlrd>=2.0.2",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "streamlit_app/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["rba"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "jupyterlab>=4.5.7",
    "mypy>=1.20.2",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_return_any = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "mlflow.*",
    "mord.*",
    "plotly.*",
    "sentence_transformers.*",
    "sklearn.*",
    "streamlit.*",
    "tqdm.*",
    "transformers.*",
    "xgboost.*",
]
ignore_missing_imports = true

