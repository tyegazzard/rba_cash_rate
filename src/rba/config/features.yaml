# RBA cash rate prediction — feature configuration
#
# Drives the feature pipeline in src/rba/features/build.py.
# Each section maps to a feature builder module.
#
# Conventions:
#   - All transforms must use only past data (no leakage).
#   - Lag and rolling windows are expressed in observations of the source series'
#     native frequency (monthly for ABS macro, daily for markets, etc.).
#   - Each feature group can be toggled on/off via `enabled: true/false`.

# ---------------------------------------------------------------------------
# Levels
# Raw (point-in-time aligned) values of each source column.
# ---------------------------------------------------------------------------
levels:
  enabled: true
  columns:
    # Macro
    - cpi_headline_yoy
    - cpi_trimmed_mean_yoy
    - unemployment_rate
    - wage_price_index_yoy
    - gdp_yoy
    - retail_trade_mom_pct          # monthly % change
    - household_consumption_qoq     # quarterly
    - household_savings_ratio       # quarterly
    - housing_credit_growth_yoy     # RBA D2
    - population_national           # ABS quarterly
    # Markets
    - asx_30d_implied_rate          # ASX 30-day interbank cash rate futures
    - aus_2y_yield
    - aus_10y_yield
    - aud_twi
    - aud_usd
    - aud_jpy
    - aud_cny
    - asx200_close
    - asx_vix
    - aus_5y_breakeven_inflation
    - aus_sovereign_cds_5y
    - cba_cds_5y
    - mortgage_to_cash_spread       # avg variable mortgage rate - cash rate
    # Housing
    - house_price_sydney
    - house_price_melbourne
    - house_price_brisbane
    - house_price_perth
    - house_price_adelaide
    - dwelling_price_index_national # ABS RPPI
    # Global
    - us_fed_funds_rate
    - us_cpi_yoy
    - vix
    # Sentiment surveys
    - westpac_mi_consumer_sentiment
    - nab_business_conditions
    - nab_business_confidence
    # Labour (high-frequency)
    - aus_payrolls_index            # ABS weekly payrolls

# ---------------------------------------------------------------------------
# Changes
# First differences and growth rates. Implemented in features/changes.py.
#
# Δ (abs_diff) and %Δ (pct_change) are MEETING-space: shift by h MEETINGS (same
# semantics as `lags:` / `rolling:`), sharing `horizons_meetings`. YoY is
# CALENDAR-anchored — the current value vs the as-of value ~`yoy.window_days`
# earlier (merge_asof backward) — so it stays a true year-over-year across the
# Feb-2024 cadence change (11/yr -> 8/yr), never a fixed meeting count (the
# Common-pitfall trap). All are leakage-safe: the compared-against row is
# strictly earlier and every level is already point-in-time (align).
#
# Columns keyed on real align series_ids (as in `imputation.strategies`), NOT the
# aspirational names. Columns absent from the frame are warn-skipped (e.g. the
# old household_savings_ratio / mortgage_to_cash_spread, never in the master).
# ---------------------------------------------------------------------------
changes:
  enabled: true
  horizons_meetings: [1, 3, 6, 12]     # shared by abs_diff + pct_change
  abs_diff:                            # level difference — rate / yield / diffusion series
    columns:
      - unemployment_rate_sa           # was unemployment_rate
      - agb_yield_10y                  # was aus_10y_yield
      - consumer_sentiment             # was westpac_mi_consumer_sentiment
      - business_conditions            # was nab_business_conditions
  pct_change:                          # % change — price / index / FX series
    columns:
      - xjo                            # was asx200_close
      - aud_twi
      - aud_usd
      - aud_cny
      - housing_median_price_house_sydney_aud_thousand
      - housing_median_price_house_melbourne_aud_thousand
      - housing_median_price_house_brisbane_aud_thousand
      - housing_median_price_house_perth_aud_thousand
      - housing_median_price_house_adelaide_aud_thousand
      - housing_price_index_rppi_legacy_8cap   # was dwelling_price_index_national
  yoy:                                 # calendar %YoY — level / index series
    window_days: 365
    columns:
      - headline_cpi_index
      - trimmed_mean_index
      - weighted_median_index
      - housing_price_index_rppi_legacy_8cap
      - commodity_prices_all_usd
      - xjo

# ---------------------------------------------------------------------------
# Lags
# Past values of each column at fixed offsets. Implemented in features/lags.py.
#
# Meeting-space semantics: the master frame (data/processed/master.parquet) is
# MEETING-indexed and carries only the as-of-latest value per series — it has no
# native monthly/daily history — so a lag here is `df[<sid>].shift(k)` over
# meeting rows, i.e. "what this series read as-of k MEETINGS ago". Horizons are
# therefore expressed in `horizons_meetings`, not native months/days. This is
# trivially leakage-safe (shift only looks at earlier meetings) and robust to the
# Feb-2024 cadence change (11/yr -> 8/yr) because time is meeting-indexed.
#
# Columns are keyed on the RAW series_id emitted by align.as_of_levels (the real
# master level-column names — same convention as `imputation.strategies` below),
# NOT the aspirational/derived names used in the `levels:` / `changes:` blocks.
# The builder lags the union of monthly_columns + daily_columns and gracefully
# warn-skips any listed column absent from the frame being built (e.g. the FRED
# global block us_fed_funds/vix, never refreshed into the master). The
# monthly/daily split is retained only as a readability grouping (macro vs
# market) — meeting-space treats both identically.
# ---------------------------------------------------------------------------
lags:
  enabled: true
  horizons_meetings: [1, 2, 3, 6, 12]
  monthly_columns:
    - headline_cpi_index                            # was cpi_headline_yoy
    - trimmed_mean_index                            # was cpi_trimmed_mean_yoy
    - unemployment_rate_sa                          # was unemployment_rate
    - wpi_total_hourly_excl_bonuses_all_sectors_sa  # was wage_price_index_yoy
    - consumer_sentiment                            # was westpac_mi_consumer_sentiment
    - business_conditions                           # was nab_business_conditions
    - credit_total_inc_fin_yoy_growth_sa            # was housing_credit_growth_yoy
    - broad_money_yoy_growth_sa
  daily_columns:
    - agb_yield_2y                                  # was aus_2y_yield
    - agb_yield_10y                                 # was aus_10y_yield
    - aud_twi
    - aud_usd
    - aud_jpy
    - aud_cny
    - bbsw_3m
    - xjo                                           # was asx200_close

# ---------------------------------------------------------------------------
# Rolling statistics
# Past-only windowed statistics. Implemented in features/rolling.py.
#
# Meeting-space semantics (same as `lags:` above): the master frame is
# MEETING-indexed and carries only the as-of-latest value per series, so a
# rolling window spans the last N MEETINGS, not N native months/days. Windows are
# expressed in `windows_meetings`. The window ends INCLUSIVELY at the current
# meeting — safe because align.as_of_levels already guarantees each row's level
# was published strictly before that meeting (Invariant #1), so the window uses
# only pre-meeting information (Invariant #3: past-only, never center=True). The
# first N-1 meetings of each window get NaN.
#
# Columns are keyed on the RAW align series_id (as in `imputation.strategies`),
# NOT the aspirational names in `levels:` / `changes:`. The builder rolls the
# union of monthly_columns + daily_columns and warn-skips any column absent from
# the frame (e.g. the FRED global block, never refreshed into the master).
# ---------------------------------------------------------------------------
rolling:
  enabled: true
  windows_meetings: [3, 6, 12]
  stats: [mean, std, zscore, min, max, ewma]
  monthly_columns:
    - headline_cpi_index            # was cpi_headline_yoy
    - trimmed_mean_index
    - unemployment_rate_sa          # was unemployment_rate
    - consumer_sentiment            # was westpac_mi_consumer_sentiment
    - business_conditions           # was nab_business_conditions
  daily_columns:
    - xjo                           # was asx200_close
    - aud_twi
    - aud_usd
    - agb_yield_10y                 # asx_vix / vix / breakeven absent from master

# ---------------------------------------------------------------------------
# Surprises
# Realised value minus consensus / RBA's prior forecast. Implemented in
# features/surprises.py. Only produces output once a consensus/forecast source
# is added — NONE exists yet (the master carries only realised as-of levels), so
# this group is `enabled: false` and the builder stays inert.
#
# Pairing is explicit — {realised_sid: consensus_sid}: realised_sid is a real
# align master column; consensus_sid is the (not-yet-sourced) forecast column a
# future consensus source will emit. The builder emits `<realised_sid>_surprise`
# = realised - consensus ONLY where BOTH columns are present in the frame, so on
# today's consensus-free master every pair is skipped (info-logged), never crash.
#
# CONTRACT for whoever adds the consensus source: each consensus series MUST be
# aligned to the SAME reference period as its realised counterpart (e.g. the
# consensus for the CPI print realised at meeting t, not a forecast of the next
# release) — otherwise realised - consensus is not a true surprise. See the
# features/surprises.py module docstring.
# ---------------------------------------------------------------------------
surprises:
  enabled: false  # turn on once a consensus/forecast source is added
  pairs:
    headline_cpi_index: consensus_headline_cpi          # was cpi_headline_yoy
    unemployment_rate_sa: consensus_unemployment_rate   # was unemployment_rate
    gdp_real_chain_volume_sa: consensus_gdp_real        # was gdp_yoy

# ---------------------------------------------------------------------------
# Regime indicators
# Binary or ordinal flags marking structural breaks. Implemented in
# features/regime.py.
# ---------------------------------------------------------------------------
regime:
  enabled: true
  governors:
    - { name: macfarlane, start: "1996-09-18", end: "2006-09-17" }
    - { name: stevens,    start: "2006-09-18", end: "2016-09-17" }
    - { name: lowe,       start: "2016-09-18", end: "2023-09-17" }
    - { name: bullock,    start: "2023-09-18", end: null }
  events:
    - { name: gfc,                start: "2007-08-01", end: "2009-12-31" }
    - { name: covid,              start: "2020-03-01", end: "2022-12-31" }
    - { name: forward_guidance,   start: "2020-03-01", end: "2021-11-02" }
  meeting_cadence_change_date: "2024-02-01"  # 11/yr -> 8/yr
  include_gap_since_last_meeting: true

# ---------------------------------------------------------------------------
# Text features
# Implemented in features/text/ (lexicon.py now; embeddings.py later). Three
# escalating tiers.
#
# `documents` are reconciled to the REAL data/external/ Parquet artifact names
# (same reconciliation the numeric blocks apply to series_ids), NOT the earlier
# aspirational names — the builder (features/text/lexicon.py) reads
# data/external/<name>.parquet and warn-skips any artifact absent on disk (e.g.
# rba_speeches, not yet refreshed). Point-in-time meeting-frame alignment of the
# per-document scores is DEFERRED to a shared text-align step (common to LM +
# custom-dict + embeddings); the lexicon builder stops at per-document scores
# keyed on publication_date.
# ---------------------------------------------------------------------------
text:
  enabled: true
  documents:
    - rba_media_releases                 # was rba_post_meeting_statement
    - rba_minutes
    - rba_somp                           # was rba_statement_on_monetary_policy
    - rba_speeches                       # was rba_governor_speeches (Parquet absent -> warn-skipped)
  lexicon:
    enabled: true
    lexicons: [loughran_mcdonald, custom_rba_hawk_dove]
    # `ratio` dropped (redundant given count + normalized_count). Per category:
    #   count            = raw category token count
    #   normalized_count = category tokens per 1000 total words (scale-free)
    # Plus a document-level lm_tone = (pos - neg)/(pos + neg); NaN when
    # pos + neg == 0 (no directional signal). See features/text/lexicon.py.
    aggregations: [count, normalized_count]
    emit_tone: true
  embeddings:
    enabled: true
    model: sentence-transformers/all-MiniLM-L6-v2
    cache_dir: data/processed/embeddings
    aggregation: document_mean
  fine_tuned_sentiment:
    enabled: false  # stretch goal
    model: null

# ---------------------------------------------------------------------------
# Search interest features (Google Trends)
# Disabled by default: pytrends rate-limits aggressively and the relative
# indexing requires care to stitch into a consistent long history.
# ---------------------------------------------------------------------------
google_trends:
  enabled: false
  queries:
    - "RBA"
    - "interest rates"
    - "mortgage stress"
    - "refinance"
    - "fixed rate home loan"
  geo: AU
  cache_dir: data/processed/google_trends

# ---------------------------------------------------------------------------
# Target lags
# Past values of the target itself (e.g. last decision) as a feature.
# Common in time-series classification.
# ---------------------------------------------------------------------------
target_lags:
  enabled: true
  horizons_meetings: [1, 2, 3]

# ---------------------------------------------------------------------------
# Imputation
# Per-series missing-value strategy for the master-frame LEVEL columns
# (data/processed/master.parquet, built by rba.data.align).
#
# Keyed on the RAW series_id emitted by align.as_of_levels — i.e. the actual
# master-frame level column names — NOT the aspirational/derived names in the
# `levels:` block above. These are the columns align.add_missing_indicators()
# pairs with a deterministic `<sid>_is_missing` flag.
#
# Invariant #4 (Imputation hygiene):
#   - PREFER letting trees handle NaN natively over imputing → project default
#     is `none`. XGBoost / LightGBM / RandomForest(HistGB) split on NaN directly.
#   - NEVER impute using whole-series statistics. Any value imputation must be
#     wrapped in the model `Pipeline` and fit PER-FOLD on the training window
#     only (§5/§7) — this section documents the *intended* strategy; it does not
#     itself impute at the align/whole-frame layer.
#   - The `<sid>_is_missing` indicator is added deterministically in align.py
#     (missingness is not fit-dependent → no leakage), so the missingness signal
#     survives whatever fill a downstream dense-matrix model applies.
#
# Strategy enum:
#   none    — leave NaN; tree models split natively (project default).
#   ffill   — carry the last known value forward (past-only, per-fold). This is
#             the `dense_fallback` for models that REQUIRE a complete matrix
#             (logistic / SVM / MLP): every series here is a non-stationary
#             level / index / price / rate, for which forward-fill is far more
#             faithful than a window mean/median.
#   median  — per-fold train-window median. Deliberately NOT used for any series
#             below: all are non-stationary, so a median is not a meaningful
#             central value. Listed only for completeness.
#   zero    — fill with 0.0. Only where 0 is semantically "none"; none below.
# ---------------------------------------------------------------------------
imputation:
  enabled: true
  default: none          # trees handle NaN natively (Invariant #4)
  dense_fallback: ffill  # applied per-fold in the Pipeline for models needing a
                         # complete matrix; never fit here, never whole-series
  # Per-series record (all `none` — every column defers to trees / the per-fold
  # dense_fallback). Grouped by source module for auditability.
  strategies:
    # abs_cpi
    headline_cpi_index: none
    trimmed_mean_index: none
    weighted_median_index: none
    # abs_labour_force
    participation_rate_sa: none
    underemployment_rate_sa: none
    unemployment_rate_sa: none
